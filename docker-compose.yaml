services:
  # ---------------------------------------------------------------- public services
  # Reachable from the internet through the Cloudflare tunnel. Everything else below is
  # bound to 127.0.0.1 and stays on this machine.

  # The dashboard, at https://port.pueyleng.com
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  # The NestJS API, at https://port-api.pueyleng.com
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # Overrides the host-facing value in backend/.env: inside the compose network the
      # database answers to its service name, not to localhost.
      DATABASE_URL: postgresql://portfolio:portfolio@db:5432/portfolio
      PARSER_URL: http://parser:8100
      QUOTES_URL: http://quotes:8200
    ports:
      # 3003 on the host because 3000-3002 are already taken on this machine. If the host
      # port is busy, Docker starts the container with no network at all: the API boots,
      # but nothing (web, cloudflared) can resolve "api".
      - "127.0.0.1:3003:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Read-only: the one-shot import of the pre-database JSON files reads from here and
      # must never be able to write back to them.
      - ./data:/app/legacy-data:ro
    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_started
      quotes:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------- private services

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      # 5434 because 5432 and 5433 are already taken on this machine. Published only so
      # prisma migrate can run from the host; never exposed through the tunnel.
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The original single-user Python API. It holds a Gmail grant and has no authentication
  # of its own, so it must never appear in the tunnel's ingress rules.
  legacy-api:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8765:8765"
    volumes:
      - ./inbox:/app/inbox
      - ./data:/app/data
      - ./credentials:/app/credentials
    restart: unless-stopped

  # Stateless PDF parser. Holds no credentials and no mailbox access: the API sends it a
  # confirmation note and the password to open it, and gets the trades back. Not published
  # to the host and not in the tunnel's ingress rules -- only the API talks to it.
  parser:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    command: uvicorn parser_service:app --host 0.0.0.0 --port 8100
    restart: unless-stopped

  # Current prices, on request. Stateless like the parser: it is told which tickers to
  # look up and answers with what the market says, nothing more.
  quotes:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    command: uvicorn quotes_service:app --host 0.0.0.0 --port 8200
    restart: unless-stopped

  # Price fetcher on the 20:30 / 00:00 / 03:00 Asia/Bangkok schedule.
  prices:
    build:
      context: .
      dockerfile: Dockerfile.prices
    volumes:
      - ./data:/app/data
    environment:
      SCHEDULE_TZ: Asia/Bangkok
      RUN_ON_START: "1"
    restart: unless-stopped

  # On-demand PDF import from a terminal:
  #   docker compose run --rm ingest python import_txs.py
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    env_file:
      - .env
    volumes:
      - ./inbox:/app/inbox
      - ./data:/app/data
      - ./credentials:/app/credentials
    profiles:
      - tools

  # ---------------------------------------------------------------- edge
  # The tunnel is the only way in. Nothing is port-forwarded and no origin certificate is
  # needed: cloudflared dials out to Cloudflare, and Cloudflare terminates TLS.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    # Behind a profile so it is opt-in: without cloudflared/credentials.json it would
    # restart-loop, and nothing should reach the internet by accident.
    #   docker compose --profile edge up -d
    profiles:
      - edge

volumes:
  db-data:
